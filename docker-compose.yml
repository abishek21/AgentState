services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentstate
      POSTGRES_PASSWORD: agentstate
      POSTGRES_DB: agentstate
    ports:
      - "5432:5432"
    volumes:
      - agentstate_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentstate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agentstate_pgdata:
